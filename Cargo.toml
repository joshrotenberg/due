[package]
name = "due"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "One command-line interface for Claude Code and Codex"
license = "MIT OR Apache-2.0"
publish = false

[features]
workflow-spike = ["dep:rhai", "dep:jsonschema", "dep:libc"]
workflow-lua-spike = ["dep:mlua", "dep:jsonschema", "dep:libc"]

[dependencies]
mlua = { version = "=0.12.2", optional = true, default-features = false, features = ["lua54", "vendored", "async", "serde"] }
rhai = { version = "=1.26.1", optional = true, default-features = false, features = ["std", "internals"] }
jsonschema = { version = "=0.56.0", optional = true, default-features = false }
claude-wrapper = { git = "https://github.com/joshrotenberg/claude-wrapper", rev = "79ffb151fd422468ef4ae988e64a20329e3bf454", default-features = false, features = ["async", "json"] }
codex-wrapper = { git = "https://github.com/joshrotenberg/codex-wrapper", rev = "1c0bbfa2a66024d094a8117ec83bca0d6b41232c" }
clap = { version = "4.5", features = ["derive"] }
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
which = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
