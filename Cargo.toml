[workspace]
members = [
    "crates/due-cli",
    "crates/due-core",
    "crates/due-harness",
    "crates/due-mcp",
    "crates/due-plugin",
    "examples/core-compare",
]
default-members = ["crates/due-cli", "crates/due-harness"]
exclude = ["examples/rpc-languages"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
due-core = { path = "crates/due-core", default-features = false }
due-harness = { path = "crates/due-harness", default-features = false }
due-mcp = { path = "crates/due-mcp" }
due-plugin = { path = "crates/due-plugin" }

clap = "4.5"
claude-wrapper = { version = "=0.14.11", default-features = false, features = ["async", "json"] }
codex-wrapper = "=0.4.9"
futures-util = { version = "0.3", default-features = false }
humantime = "2"
libc = "0.2"
rquickjs = { version = "=0.14.0", default-features = false }
schemars = "1.2"
serde = "1"
serde_json = "1"
tempfile = "3"
tokio = "1"
tokio-util = "0.7"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
tower-mcp = { version = "=0.25.0", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false }
uuid = "1"
which = "8"
