name: Due issue
description: Report a Due defect, installation problem, or confusing documented behavior.
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: |
        Include a minimal reproduction for run, script, RPC, or installation behavior.
        Review evidence before posting; omit credentials, private task content, and raw configuration files.
  - type: textarea
    id: symptom
    attributes:
      label: Expected and actual behavior
      description: Include the exit status and independently observed changes, if relevant.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Build and environment
      description: Due Git commit, due --version, resolved binary path, provider CLI version/model, OS/architecture, plugin host/version, and whether binary/plugin were refreshed.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Sanitized command/profile, script or RPC sequence, and synthetic prompt. Note native options.
      render: shell
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Result, evidence summary, and checks
      description: Relevant error fields or a small sanitized trace/process receipt summary. Avoid full raw logs. Note stream gaps, cleanup failures and observed effects.
  - type: textarea
    id: workaround
    attributes:
      label: Workaround or related issue
      description: If known. No need to rerun a mutating task solely for this report.
