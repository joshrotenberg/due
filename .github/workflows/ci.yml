name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  caller-example:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test examples/node-caller/caller.test.mjs
  python-caller-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install -r examples/offline-validation/requirements.txt
      - run: python -B -m unittest discover -s examples/offline-validation -p 'test_*.py' -v
      - run: python -B -m unittest discover -s examples/native-schema-smoke -p 'test_*.py' -v
      - run: node --check examples/native-schema-smoke/fake-due.fixture.mjs
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Install from source and smoke-test offline commands
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          install_root="$RUNNER_TEMP/due-source-install"
          cargo install --path . --locked --offline --debug --root "$install_root"
          cd "$RUNNER_TEMP"
          binary="$install_root/bin/due"
          PATH='' "$binary" --version
          PATH='' "$binary" skills list --output json > due-installed-skills.json
          PATH='' "$binary" skills show run --output json > due-installed-run-guide.json
          PATH='' "$binary" schema request > due-installed-request.schema.json
          PATH='' "$binary" schema trace-summary > due-installed-summary.schema.json
          : > due-empty-trace.jsonl
          PATH='' "$binary" trace summarize due-empty-trace.jsonl --output json > due-installed-summary.json
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
      - run: cargo check --locked
