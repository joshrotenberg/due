name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  caller-example:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test examples/node-caller/caller.test.mjs
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --target-dir target/default -- -D warnings
      - run: cargo test --locked --target-dir target/default
      - name: Check the opt-in workflow spike
        run: |
          for variant in rhai lua both fennel quickjs all; do
            case "$variant" in
              rhai) features=workflow-spike ;;
              lua) features=workflow-lua-spike ;;
              both) features=workflow-spike,workflow-lua-spike ;;
              fennel) features=workflow-fennel-spike ;;
              quickjs) features=workflow-quickjs-spike ;;
              all) features=workflow-spike,workflow-fennel-spike,workflow-quickjs-spike ;;
            esac
            cargo clippy --locked --all-targets --features "$features" --target-dir "target/$variant" -- -D warnings
            cargo test --locked --features "$features" --target-dir "target/$variant"
          done
      - name: Install from source and smoke-test offline commands
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          install_root="$RUNNER_TEMP/due-source-install"
          cargo install --path . --locked --offline --debug --root "$install_root"
          cd "$RUNNER_TEMP"
          binary="$install_root/bin/due"
          PATH='' "$binary" --version
          PATH='' "$binary" skills list --output json > due-installed-skills.json
          PATH='' "$binary" skills show run --output json > due-installed-run-guide.json
          PATH='' "$binary" schema request > due-installed-request.schema.json
          PATH='' "$binary" schema trace-summary > due-installed-summary.schema.json
          : > due-empty-trace.jsonl
          PATH='' "$binary" trace summarize due-empty-trace.jsonl --output json > due-installed-summary.json
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
      - run: cargo check --locked --target-dir target/default
      - run: cargo check --locked --all-targets --features workflow-spike --target-dir target/rhai
      - run: cargo check --locked --all-targets --features workflow-lua-spike --target-dir target/lua
      - run: cargo check --locked --all-targets --features workflow-spike,workflow-lua-spike --target-dir target/both
      - run: cargo check --locked --all-targets --features workflow-fennel-spike --target-dir target/fennel
      - run: cargo check --locked --all-targets --features workflow-quickjs-spike --target-dir target/quickjs
      - run: cargo check --locked --all-targets --all-features --target-dir target/all
