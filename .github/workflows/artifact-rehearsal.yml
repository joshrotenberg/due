name: Artifact rehearsal

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/artifact-rehearsal.yml
      - scripts/rehearse-package.sh

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package and verify
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_TARGET"
          mkdir "$RUNNER_TEMP/due-artifacts"
          bash scripts/rehearse-package.sh "$RUNNER_TEMP/due-artifacts"
      - uses: actions/upload-artifact@v7
        with:
          name: due-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/due-artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
