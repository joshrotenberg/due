name: Artifact rehearsal

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/artifact-rehearsal.yml
      - Cargo.toml
      - Cargo.lock
      - LICENSE-APACHE
      - LICENSE-MIT
      - README.md
      - crates/due-cli/Cargo.toml
      - scripts/install-rehearsal-dist.sh
      - scripts/smoke-package.sh
      - scripts/smoke-dist-installer.sh

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build target archive with dist
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_TARGET"
          bash scripts/install-rehearsal-dist.sh "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/dist" build --artifacts=local --target "$EXPECTED_TARGET" --output-format=json > "$RUNNER_TEMP/local-dist-manifest.json"
          git diff HEAD --exit-code -- Cargo.lock
          cp "$RUNNER_TEMP/local-dist-manifest.json" "target/distrib/$EXPECTED_TARGET-dist-manifest.json"
      - uses: actions/upload-artifact@v7
        with:
          name: due-dist-target-${{ matrix.target }}
          path: |
            target/distrib/due-cli-${{ matrix.target }}.tar.gz
            target/distrib/due-cli-${{ matrix.target }}.tar.gz.sha256
            target/distrib/${{ matrix.target }}-dist-manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  installer:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v7
        with:
          pattern: due-dist-target-*
          path: target/distrib
          merge-multiple: true
      - name: Assemble shell installer and checksums
        shell: bash
        run: |
          bash scripts/install-rehearsal-dist.sh "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/dist" build --artifacts=global --output-format=json > "$RUNNER_TEMP/dist-manifest.json"
          git diff HEAD --exit-code -- Cargo.lock
          sh -n target/distrib/due-cli-installer.sh
          (cd target/distrib && sed '/^$/d' sha256.sum | shasum -a 256 --strict -c -)
          cp "$RUNNER_TEMP/dist-manifest.json" target/distrib/dist-manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: due-dist-installer
          path: |
            target/distrib/due-cli-installer.sh
            target/distrib/sha256.sum
            target/distrib/dist-manifest.json
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Smoke (${{ matrix.platform }})
    needs: installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS 15 arm64
            os: macos-15
            version: '15'
            target: aarch64-apple-darwin
          - platform: macOS 26 arm64
            os: macos-26
            version: '26'
            target: aarch64-apple-darwin
          - platform: macOS 27 arm64
            # The Xcode 27 preview image runs macOS 27.
            os: xcode-27
            version: '27'
            target: aarch64-apple-darwin
          - platform: Ubuntu 24.04 x86-64
            os: ubuntu-24.04
            version: '24.04'
            target: x86_64-unknown-linux-gnu
          - platform: Ubuntu 26.04 x86-64
            os: ubuntu-26.04
            version: '26.04'
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: due-dist-target-${{ matrix.target }}
          path: ${{ runner.temp }}/due-artifacts
      - uses: actions/download-artifact@v7
        with:
          name: due-dist-installer
          path: ${{ runner.temp }}/due-installer
      - name: Verify runner and downloaded package
        shell: bash
        env:
          EXPECTED_VERSION: ${{ matrix.version }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            version=$(sw_vers -productVersion)
            echo "macOS $version"
            test "${version%%.*}" = "$EXPECTED_VERSION"
          else
            source /etc/os-release
            echo "$PRETTY_NAME"
            test "$ID" = ubuntu
            test "$VERSION_ID" = "$EXPECTED_VERSION"
          fi
          archive="$RUNNER_TEMP/due-artifacts/due-cli-$EXPECTED_TARGET.tar.gz"
          installer="$RUNNER_TEMP/due-installer"
          version=$(python3 -I - "$installer/dist-manifest.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          [release] = json.loads(Path(sys.argv[1]).read_text())["releases"]
          assert release["app_name"] == "due-cli", release
          print(release["app_version"])
          PY
          )
          bash scripts/smoke-package.sh "$EXPECTED_TARGET" "$GITHUB_SHA" "$archive" "$version"
          bash scripts/smoke-dist-installer.sh "$archive" "$installer/due-cli-installer.sh"
