name: Artifact rehearsal

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/artifact-rehearsal.yml
      - scripts/rehearse-package.sh
      - scripts/smoke-package.sh

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package and verify
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_TARGET"
          mkdir "$RUNNER_TEMP/due-artifacts"
          bash scripts/rehearse-package.sh "$RUNNER_TEMP/due-artifacts"
      - uses: actions/upload-artifact@v7
        with:
          name: due-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/due-artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  smoke:
    name: Smoke (${{ matrix.platform }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS 15 arm64
            os: macos-15
            version: '15'
            target: aarch64-apple-darwin
          - platform: macOS 26 arm64
            os: macos-26
            version: '26'
            target: aarch64-apple-darwin
          - platform: macOS 27 arm64
            # The Xcode 27 preview image runs macOS 27.
            os: xcode-27
            version: '27'
            target: aarch64-apple-darwin
          - platform: Ubuntu 24.04 x86-64
            os: ubuntu-24.04
            version: '24.04'
            target: x86_64-unknown-linux-gnu
          - platform: Ubuntu 26.04 x86-64
            os: ubuntu-26.04
            version: '26.04'
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v7
        with:
          name: due-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/due-artifacts
      - name: Verify runner and downloaded package
        shell: bash
        env:
          EXPECTED_VERSION: ${{ matrix.version }}
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            version=$(sw_vers -productVersion)
            echo "macOS $version"
            test "${version%%.*}" = "$EXPECTED_VERSION"
          else
            source /etc/os-release
            echo "$PRETTY_NAME"
            test "$ID" = ubuntu
            test "$VERSION_ID" = "$EXPECTED_VERSION"
          fi
          bash scripts/smoke-package.sh "$EXPECTED_TARGET" "$GITHUB_SHA" "$RUNNER_TEMP"/due-artifacts/*.tar.gz
