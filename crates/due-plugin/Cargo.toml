[package]
name = "due-plugin"
version = "0.2.1"
edition = "2024"
rust-version = "1.90"
description = "Local package and managed installer for the Due delegate plugin"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "time"] }
which = "8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt"] }
