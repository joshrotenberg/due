[package]
name = "due-js"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
description = "Embedded JavaScript workflows over due-core"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
due-harness = { path = "../due-harness", default-features = false, features = ["core", "js"] }
rquickjs.workspace = true
serde_json = "1"

[dev-dependencies]
tempfile = "3"
