[package]
name = "due-js"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
description = "Embedded JavaScript workflows over due-core"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
due-core = { path = "../due-core" }
due-harness = { path = "../due-harness", default-features = false, features = ["js"] }
rquickjs.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3"
