[package]
name = "due-harness"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Internal owned JavaScript workflow runtime for Due"

[features]
default = ["js"]
js = ["dep:rquickjs"]

[dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros", "signal"] }
rquickjs = { workspace = true, optional = true, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
