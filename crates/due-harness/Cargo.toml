[package]
name = "due-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
description = "Internal owned JavaScript workflow runtime for Due"

[features]
default = ["js"]
js = ["dep:rquickjs"]
core = ["dep:due-core", "dep:serde"]
lua = ["dep:mlua"]

[dependencies]
due-core = { path = "../due-core", optional = true }
mlua = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros", "signal"] }
rquickjs = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
