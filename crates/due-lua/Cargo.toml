[package]
name = "due-lua"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
description = "Embedded Lua workflows over due-core"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
due-harness = { path = "../due-harness", default-features = false, features = ["core", "lua"] }
mlua.workspace = true
serde_json = "1"

[dev-dependencies]
due-js = { path = "../due-js" }
tempfile = "3"
