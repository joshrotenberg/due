[package]
name = "due-cli"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
description = "One command-line interface for Claude Code and Codex"
readme = "../../README.md"
license.workspace = true
publish.workspace = true
repository.workspace = true

[package.metadata.dist]
dist = true
features = ["mcp-stdio"]

[[bin]]
name = "due"
path = "src/main.rs"

[lib]
name = "due"

[features]
default = ["harness"]
harness = ["rpc", "dep:due-harness"]
core = ["due-core/resident"]
mcp-stdio = ["dep:due-mcp"]
rpc = ["core", "dep:tokio-util", "dep:futures-util", "tokio/io-std", "tokio/net", "tokio/sync"]

[dependencies]
due-core = { workspace = true, features = ["oneshot"] }
due-harness = { workspace = true, features = ["js"], optional = true }
due-mcp = { workspace = true, optional = true }
due-plugin.workspace = true
tokio-util = { workspace = true, features = ["codec"], optional = true }
futures-util = { workspace = true, features = ["std", "sink"], optional = true }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time", "process", "io-util"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["registry"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
