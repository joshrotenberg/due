[package]
name = "due-core"
version = "0.2.1"
edition = "2024"
rust-version = "1.90"
description = "Scoped Claude Code and Codex session supervision"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = ["resident"]
oneshot = ["dep:claude-wrapper", "dep:codex-wrapper", "dep:libc", "dep:tempfile", "dep:toml", "dep:which"]
resident = ["codex-wrapper/app-server", "dep:claude-wrapper", "dep:codex-wrapper", "dep:tokio", "dep:toml", "dep:uuid", "dep:which"]

[dependencies]
claude-wrapper = { workspace = true, optional = true }
codex-wrapper = { workspace = true, optional = true }
humantime = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"], optional = true }
toml = { workspace = true, optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
which = { version = "8", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
