[package]
name = "due-core"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
description = "Scoped Claude Code and Codex session supervision"
license.workspace = true
publish.workspace = true

[features]
default = ["resident"]
oneshot = ["dep:claude-wrapper", "dep:codex-wrapper", "dep:libc", "dep:tempfile", "dep:toml", "dep:which"]
resident = ["codex-wrapper/app-server", "dep:claude-wrapper", "dep:codex-wrapper", "dep:tokio", "dep:toml", "dep:uuid", "dep:which"]

[dependencies]
claude-wrapper = { workspace = true, optional = true }
codex-wrapper = { workspace = true, optional = true }
humantime.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"], optional = true }
toml = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"], optional = true }
which = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true
