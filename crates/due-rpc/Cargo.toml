[package]
name = "due-rpc"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
description = "Stdio JSON-RPC adapter for due-core"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
due-core = { path = "../due-core" }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "process"] }
