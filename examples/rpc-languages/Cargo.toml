[package]
name = "due-rpc-languages"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false

# Historical comparison remains a separate build while reusing the shipped runtime.
[workspace]
resolver = "3"

[features]
default = ["lua", "js"]
lua = ["dep:mlua", "due-harness/lua"]
js = ["due-harness/js"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
due-harness = { path = "../../crates/due-harness", default-features = false }
mlua = { version = "=0.12.2", optional = true, default-features = false, features = ["lua54", "vendored", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
