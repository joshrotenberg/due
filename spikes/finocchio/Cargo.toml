[package]
name = "finocchio-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace]

[dependencies]
mlua = { version = "=0.12.2", default-features = false, features = ["lua54", "vendored", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
